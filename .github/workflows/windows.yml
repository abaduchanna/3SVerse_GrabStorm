name: Build TurboGrab

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Collect docs into dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item LICENSE dist\LICENSE.txt
          Copy-Item README.md dist\README.md

      - name: Compile resources
        shell: pwsh
        run: |
          windres src\icon.rc -O coff -o src\icon_res.o
          if ($LASTEXITCODE -ne 0) { throw "windres failed" }

      - name: Compile TurboGrab.exe
        shell: pwsh
        run: |
          gcc src\main.c src\localsrv.c src\icon_res.o -o dist\TurboGrab.exe `
            -mwindows `
            -lwinhttp -lws2_32 -ladvapi32 -lcomctl32 -lshell32 -lole32 -lgdi32 -luser32 -lkernel32 -s
          if ($LASTEXITCODE -ne 0) { throw "gcc failed" }
          Get-Item dist\TurboGrab.exe | Select-Object Name,Length

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath Output\TurboGrab_Portable.zip -Force

      - name: Package browser extensions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extchrome, extfirefox | Out-Null
          Copy-Item extension\* extchrome\ -Recurse -Exclude manifest.firefox.json
          Copy-Item extension\* extfirefox\ -Recurse -Exclude manifest.json
          Rename-Item extfirefox\manifest.firefox.json manifest.json
          Compress-Archive -Path extchrome\* -DestinationPath Output\TurboGrab_Extension_Chrome.zip -Force
          Compress-Archive -Path extfirefox\* -DestinationPath Output\TurboGrab_Extension_Firefox.zip -Force
          Get-ChildItem Output | Select-Object Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbograb-build
          path: |
            dist/TurboGrab.exe
            dist/LICENSE.txt
            dist/README.md
            Output/*.exe
            Output/*.zip
            Output/TurboGrab_Extension_*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: turbograb-build
          path: artifact

      - name: Flatten artifact tree (upload-artifact@v4 preserves structure)
        run: |
          mkdir -p rel
          find artifact -type f \( -name "*_Setup.exe" -o -name "*Portable.zip" -o -name "TurboGrab_Extension_*.zip" \) -exec mv {} rel/ \;
          ls -la rel/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" rel/* --title "TurboGrab ${TAG}" --notes "Free & open download accelerator for Windows — multi-segment HTTP(S) downloads with pause/resume, queue, clipboard monitoring, category folders and browser extension integration. MIT licensed.\n\n- TurboGrab_v${TAG#v}_Setup.exe — installer (no admin needed)\n- TurboGrab_Portable.zip — unzip anywhere and run TurboGrab.exe\n- TurboGrab_Extension_Chrome.zip — Edge/Chrome/Brave extension: unzip, then chrome://extensions > Developer mode > Load unpacked\n- TurboGrab_Extension_Firefox.zip — Firefox extension: unzip, then about:debugging#/runtime/this-firefox > Load Temporary Add-on, or install via about:addons"
