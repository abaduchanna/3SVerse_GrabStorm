name: Build TurboGrab

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Collect docs into dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item LICENSE dist\LICENSE.txt
          Copy-Item README.md dist\README.md

      - name: Compile resources
        shell: pwsh
        run: |
          windres src\icon.rc -O coff -o src\icon_res.o
          if ($LASTEXITCODE -ne 0) { throw "windres failed" }

      - name: Compile TurboGrab.exe
        shell: pwsh
        run: |
          gcc src\main.c src\localsrv.c src\icon_res.o -o dist\TurboGrab.exe `
            -mwindows `
            -lwinhttp -lws2_32 -ladvapi32 -lcomctl32 -lshell32 -lole32 -lgdi32 -luser32 -lkernel32 -s
          if ($LASTEXITCODE -ne 0) { throw "gcc failed" }
          Get-Item dist\TurboGrab.exe | Select-Object Name,Length

      # ext zips are packaged FIRST: installer.iss bundles them into {app}\extensions
      - name: Package browser extensions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extchrome, extfirefox, Output | Out-Null
          Copy-Item extension\* extchrome\ -Recurse -Exclude manifest.firefox.json
          Copy-Item extension\* extfirefox\ -Recurse -Exclude manifest.json
          Rename-Item extfirefox\manifest.firefox.json manifest.json
          Compress-Archive -Path extchrome\* -DestinationPath Output\TurboGrab_Extension_Chrome.zip -Force
          Compress-Archive -Path extfirefox\* -DestinationPath Output\TurboGrab_Extension_Firefox.zip -Force

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath Output\TurboGrab_Portable.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbograb-build
          if-no-files-found: error
          path: |
            dist/TurboGrab.exe
            dist/LICENSE.txt
            dist/README.md
            Output/*.exe
            Output/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      EXT_ID: ooclbgcgolihefahehfjjcmlfdlhncno
      PAGES_BASE: https://abaduchanna.github.io/3SVerse_TurboGrab
    steps:
      - name: Checkout (signing key + CRX3 packer)
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: turbograb-build
          path: artifact

      - name: Flatten artifact tree
        run: |
          mkdir -p rel
          find artifact -type f \( -name "*_Setup.exe" -o -name "*Portable.zip" -o -name "TurboGrab_Extension_*.zip" \) -exec mv {} rel/ \;
          ls -la rel/

      - name: Pack CRX3 + build hosted update files
        run: |
          VER="${GITHUB_REF_NAME#v}"
          rm -rf stage hosted && mkdir -p stage hosted
          (cd stage && unzip -q ../rel/TurboGrab_Extension_Chrome.zip)
          python3 scripts/pack_crx3.py stage signing/turbograb-ext.pem hosted/TurboGrab.crx
          cp rel/TurboGrab_Extension_Firefox.zip hosted/TurboGrab.xpi
          cat > hosted/update.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <gupdate xmlns="http://www.google.com/update2/response" protocol="2.0">
            <app appid="${EXT_ID}">
              <updatecheck codebase="${PAGES_BASE}/TurboGrab.crx" version="${VER}" />
            </app>
          </gupdate>
          XML
          cat > hosted/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>TurboGrab extension hosting</title>
          <p>Self-hosted update files for the TurboGrab browser extension (policy-installed by TurboGrab Setup).</p>
          <ul>
            <li><a href="update.xml">update.xml</a></li>
            <li><a href="TurboGrab.crx">TurboGrab.crx</a></li>
            <li><a href="TurboGrab.xpi">TurboGrab.xpi</a></li>
          </ul>
          HTML
          cp hosted/TurboGrab.crx hosted/TurboGrab.xpi hosted/update.xml rel/
          python3 scripts/verify_crx3.py hosted/TurboGrab.crx signing/turbograb-ext.pem
          ls -la hosted/

      - name: Publish hosted update files (gh-pages)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "3SVerse CI"
          git config user.email "abaduchanna@gmail.com"
          rm -rf pages && mkdir pages && cd pages
          git init -q -b gh-pages
          git config user.name "3SVerse CI"
          git config user.email "abaduchanna@gmail.com"
          cp ../hosted/* .
          git add -A
          git commit -q -m "hosted update files ${GITHUB_REF_NAME}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" gh-pages

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="Free & open download accelerator for Windows — multi-segment HTTP(S) downloads with pause/resume, queue, clipboard monitoring, category folders and browser extension integration. MIT licensed.

          **New in ${TAG}:** the Setup now auto-installs the TurboGrab Integration extension into every installed Chromium browser (Chrome, Edge, Brave, Opera, Vivaldi, Yandex) and Firefox via per-user policies — no store needed, no admin prompt. Restart your browser once after installing. Uninstalling TurboGrab removes the integration cleanly. Manual zips remain available below.

          - TurboGrab_v${TAG#v}_Setup.exe — installer (no admin needed)
          - TurboGrab_Portable.zip — unzip anywhere and run TurboGrab.exe
          - TurboGrab.crx + update.xml — self-hosted policy-install source (served at ${PAGES_BASE})
          - TurboGrab.xpi / TurboGrab_Extension_Firefox.zip — Firefox add-on (release-channel Firefox requires signed add-ons; load temporarily via about:debugging, or use ESR/Dev where policy install works)
          - TurboGrab_Extension_Chrome.zip — manual option: chrome://extensions > Developer mode > Load unpacked"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" rel/* --clobber
          else
            gh release create "$TAG" rel/* --title "TurboGrab ${TAG}" --notes "$NOTES"
          fi
