<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; font: 13px "Segoe UI", system-ui, sans-serif; background: #10141c; color: #e8ecf2; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #232a36; }
  .bolt { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #f7b733, #fc4a1a);
          display: flex; align-items: center; justify-content: center; font-weight: 700; color: #10141c; font-size: 13px; }
  h1 { font-size: 14px; margin: 0; }
  section { padding: 10px 12px; }
  .status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
  .dot.on { background: #37c26e; box-shadow: 0 0 6px #37c26e88; }
  .dot.off { background: #e0484f; }
  .sub { color: #93a0b4; font-size: 11px; margin-top: 3px; }
  label.row { display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer; }
  footer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #232a36; }
  button { flex: 1; background: #1c2534; color: #e8ecf2; border: 1px solid #2d3a4e; border-radius: 6px;
           padding: 7px 8px; cursor: pointer; font-size: 12px; }
  button:hover { background: #253147; }
  a { color: #f7b733; text-decoration: none; font-size: 11px; }
</style>
</head>
<body>
  <header>
    <div class="bolt">TG</div>
    <h1>TurboGrab</h1>
  </header>
  <section>
    <div class="status">
      <div class="dot" id="dot"></div>
      <div>
        <div id="status">Checking&hellip;</div>
        <div class="sub" id="statusSub"></div>
      </div>
    </div>
    <label class="row">
      <input type="checkbox" id="takeover">
      <span>Take over browser downloads</span>
    </label>
  </section>
  <footer>
    <button id="openOpts">Settings</button>
    <button id="openApp">Open app</button>
  </footer>
  <section>
    <a href="https://github.com/abaduchanna/3SVerse_TurboGrab" target="_blank">TurboGrab on GitHub</a>
  </section>
  <script src="popup.js"></script>
</body>
</html>
