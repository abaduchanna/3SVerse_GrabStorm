<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GrabStorm Integration</title>
  <style>
    body { font: 14px "Segoe UI", sans-serif; background: #07060b; color: #f5f1e6;
           width: 320px; padding: 24px; }
    h1 { font-size: 15px; letter-spacing: 2px; color: #6ee7ef; margin: 0 0 16px; }
    label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
    p.dim { color: #9b97b3; font-size: 12px; }
  </style>
</head>
<body>
  <h1>GRABSTORM INTEGRATION</h1>
  <label>
    <input type="checkbox" id="auto">
    <span>Auto-capture direct file links</span>
  </label>
  <p class="dim">Right-click any link for "Download with GrabStorm". Captured links open in the GrabStorm desktop app.</p>
  <script src="options.js"></script>
</body>
</html>
